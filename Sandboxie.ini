[test1]
# Fixes "CreateDesktop: Access is denied" in CLI (agy.exe)
NoSandboxieConsole=y
OpenWndStation=y
UseSbieDeskHack=y
UseSbieWndStation=y
OpenWinClass=*

# Preserves elevated token & removes Job Object limits (Application Compartment)
NoSecurityIsolation=y
DropAdminRights=n

# Chromium & Electron GUI engine compatibility
SpecialImage=chrome,Antigravity.exe
CustomChromiumFlags=--no-sandbox

# Opens OAuth login in host default browser
BreakoutProcess=chrome.exe
